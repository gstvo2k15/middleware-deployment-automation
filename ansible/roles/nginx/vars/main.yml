nginx_listen_port: 80
nginx_ssl_port: 443

nginx_tomcat_servers:
  - { name: "server1", ip: "192.168.1.101", port: "8080" }
  - { name: "server2", ip: "192.168.1.102", port: "8080" }

nginx_ssl_certificate: "/etc/nginx/ssl/nginx.crt"
