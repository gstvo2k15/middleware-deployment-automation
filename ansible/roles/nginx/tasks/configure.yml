- name: Deploy main nginx.conf
  ansible.builtin.template:
    src: "nginx.conf.j2"
    dest: "/etc/nginx/nginx.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Nginx

- name: Deploy load balancer configuration
  ansible.builtin.template:
    src: "load-balancer.conf.j2"
    dest: "/etc/nginx/conf.d/load-balancer.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Nginx

- name: Deploy SSL configuration
  ansible.builtin.template:
    src: "ssl.conf.j2"
    dest: "/etc/nginx/conf.d/ssl.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Nginx
